<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="日迹——一个简洁、私人的本地生活记录网页。"
    />
    <title>日迹 · 生活记录</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <a class="brand" href="#" aria-label="返回顶部">
          <span class="brand-mark" aria-hidden="true">日</span>
          <span>日迹</span>
        </a>

        <button
          class="quiet-button"
          id="backupButton"
          type="button"
          aria-expanded="false"
          aria-controls="backupPanel"
        >
          数据备份
        </button>
      </header>

      <main>
        <section class="hero" aria-labelledby="pageTitle">
          <div>
            <p class="eyebrow" id="todayLabel"></p>
            <h1 id="pageTitle">把发生过的事，<br />留下一句话。</h1>
            <p class="hero-copy">
              不必写成长篇日记。一个日期，一段描述，就足以在以后唤起今天。
            </p>
          </div>

          <button class="primary-button" id="openComposerButton" type="button">
            <span aria-hidden="true">＋</span>
            写一条记录
          </button>
        </section>

        <section
          class="backup-panel"
          id="backupPanel"
          aria-label="数据备份"
          hidden
        >
          <div>
            <strong>记录只保存在这个浏览器中</strong>
            <p>建议偶尔导出备份。以后换电脑时，可以再导入回来。</p>
          </div>
          <div class="backup-actions">
            <button class="secondary-button" id="exportButton" type="button">
              导出备份
            </button>
            <button class="secondary-button" id="importButton" type="button">
              导入备份
            </button>
            <input
              id="importInput"
              type="file"
              accept="application/json,.json"
              hidden
            />
          </div>
        </section>

        <section class="records-section" aria-labelledby="recordsTitle">
          <div class="section-heading">
            <div>
              <p class="section-kicker">MY MOMENTS</p>
              <h2 id="recordsTitle">生活片段</h2>
            </div>

            <label class="search-box">
              <span class="visually-hidden">搜索记录</span>
              <span aria-hidden="true">⌕</span>
              <input
                id="searchInput"
                type="search"
                placeholder="搜索描述或日期"
                autocomplete="off"
              />
            </label>
          </div>

          <div id="recordsList" aria-live="polite"></div>

          <div class="empty-state" id="emptyState" hidden>
            <span class="empty-date" id="emptyDate" aria-hidden="true"></span>
            <h3>这里还没有记录</h3>
            <p>从今天开始就好，不需要补齐过去。</p>
            <button
              class="text-button"
              id="emptyComposerButton"
              type="button"
            >
              写下第一条记录 →
            </button>
          </div>

          <div class="empty-state compact" id="searchEmptyState" hidden>
            <h3>没有找到相关记录</h3>
            <p>换一个关键词试试看。</p>
          </div>
        </section>
      </main>

      <footer>
        <span>日迹</span>
        <span>记录生活，不追求完整。</span>
      </footer>
    </div>

    <dialog class="composer" id="composerDialog">
      <form class="composer-card" id="recordForm">
        <div class="composer-heading">
          <div>
            <p class="section-kicker">A NEW MOMENT</p>
            <h2 id="composerTitle">写一条记录</h2>
          </div>
          <button
            class="icon-button"
            id="closeComposerButton"
            type="button"
            aria-label="关闭"
          >
            ×
          </button>
        </div>

        <input id="recordId" type="hidden" />

        <label class="field">
          <span>日期</span>
          <input id="recordDate" type="date" required />
        </label>

        <label class="field">
          <span>简单描述</span>
          <textarea
            id="recordDescription"
            rows="6"
            maxlength="1000"
            placeholder="今天去了哪里，做了什么？"
            required
          ></textarea>
          <small><span id="characterCount">0</span> / 1000</small>
        </label>

        <div class="composer-actions">
          <button
            class="secondary-button danger-button"
            id="deleteButton"
            type="button"
            hidden
          >
            删除
          </button>
          <div class="composer-actions-right">
            <button
              class="secondary-button"
              id="cancelButton"
              type="button"
            >
              取消
            </button>
            <button class="primary-button" type="submit">保存记录</button>
          </div>
        </div>
      </form>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="./app.js"></script>
  </body>
</html>
