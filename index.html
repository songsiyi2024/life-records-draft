<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="日迹——一个只记录日期和文字的生活记录网页。"
    />
    <title>日迹 · 生活记录</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <a class="brand" href="#" aria-label="返回顶部">
          <span class="brand-mark" aria-hidden="true">日</span>
          <span>日迹</span>
        </a>

        <nav class="header-actions" aria-label="记录操作">
          <a
            class="quiet-button"
            href="https://github.com/songsiyi2024/life-records-draft/edit/main/records.js"
            target="_blank"
            rel="noreferrer"
          >
            编辑记录
          </a>
        </nav>
      </header>

      <main>
        <section class="hero" aria-labelledby="pageTitle">
          <div>
            <p class="eyebrow" id="todayLabel"></p>
            <h1 id="pageTitle">把发生过的事，<br />留下一句话。</h1>
            <p class="hero-copy">
              不必写成长篇日记。一个日期，一段描述，就足以在以后唤起今天。
            </p>
          </div>

          <a
            class="primary-button"
            href="https://github.com/songsiyi2024/life-records-draft/edit/main/records.js"
            target="_blank"
            rel="noreferrer"
          >
            <span aria-hidden="true">✎</span>
            写一条记录
          </a>
        </section>

        <section class="github-panel" aria-label="记录方式说明">
          <div class="privacy-mark" aria-hidden="true">GITHUB</div>
          <div>
            <strong>文字直接保存在仓库的 records.js</strong>
            <p>
              点击“写一条记录”，在文件最前面加上日期和文字并提交，网页就会更新。
            </p>
          </div>
          <a
            class="secondary-button"
            href="https://github.com/songsiyi2024/life-records-draft/blob/main/records.js"
            target="_blank"
            rel="noreferrer"
          >
            查看记录文件
          </a>
        </section>

        <section class="records-section" aria-labelledby="recordsTitle">
          <div class="section-heading">
            <div>
              <p class="section-kicker">MY MOMENTS</p>
              <h2 id="recordsTitle">生活片段</h2>
            </div>

            <label class="search-box">
              <span class="visually-hidden">
                搜索记录
              </span>
              <span aria-hidden="true">⌕</span>
              <input
                id="searchInput"
                type="search"
                placeholder="搜索描述或日期"
                autocomplete="off"
              />
            </label>
          </div>

          <div id="recordsList" aria-live="polite"></div>

          <div class="empty-state" id="emptyState" hidden>
            <span class="empty-date" id="emptyDate" aria-hidden="true"></span>
            <h3>这里还没有记录</h3>
            <p>打开 records.js，写下第一条日期和文字。</p>
            <a
              class="text-button"
              href="https://github.com/songsiyi2024/life-records-draft/edit/main/records.js"
              target="_blank"
              rel="noreferrer"
            >
              写下第一条记录 →
            </a>
          </div>

          <div class="empty-state compact" id="searchEmptyState" hidden>
            <h3>没有找到相关记录</h3>
            <p>换一个关键词试试看。</p>
          </div>
        </section>
      </main>

      <footer>
        <span>日迹</span>
        <span>记录生活，不追求完整。</span>
      </footer>
    </div>

    <script src="./records.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
